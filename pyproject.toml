[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rss-daily-collector"
version = "1.0.0"
description = "Deterministic RSS/Atom collection pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["feedparser==6.0.11"]

[project.optional-dependencies]
dev = ["black==24.10.0", "pytest==8.3.5", "ruff==0.9.10"]

[project.scripts]
rss-daily = "rss_daily_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
